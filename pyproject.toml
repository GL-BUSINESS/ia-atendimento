[project]
name = "ia-atendimento"
version = "0.2.0"
description = "IA de atendimento GL Capital: orquestrador (fundação do repositório)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
# Versões pinadas (uv.lock é a fonte; estes `==` evitam que um `uv lock --upgrade` mude o conjunto sem revisão).
# procrastinate 3.x traz psycopg como dependência fixa: não existe o extra `[psycopg]` (o `uv lock` avisa).
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic-settings==2.16.2",
  "pydantic-ai-slim[openai]==2.63.0",
  "procrastinate==3.10.0",
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",  # pool de conexões da API (B1.5); já vinha como dependência do Procrastinate
  "sqlalchemy==2.1.6",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp==1.45.2",
  "openinference-instrumentation-pydantic-ai==0.1.32",
  "cryptography==50.0.2",
  "tzdata==2026.6",
]

[project.scripts]
ia-worker = "ia_atendimento.worker:main"  # = `python -m ia_atendimento.worker` (R2-02); `--saude` é o healthcheck

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "httpx==0.28.1",
  "ruff==0.17.3",
  "pytest-timeout==2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ia_atendimento"]
# o /readyz confere o checksum das migrações contra a pasta: instalada em site-packages ela viaja dentro do pacote (R1-09);
# as fixtures de 3RN/C6/360 (B2.4) viajam igual: o gateway as lê em `duble|teste`
force-include = { "migrations" = "ia_atendimento/migrations", "fixtures" = "ia_atendimento/fixtures" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 120  # por teste (pytest-timeout, R2-07): um teste que trava FALHA em 2 min em vez de segurar a suíte até o `timeout 600` do check.sh
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "banco: precisa de um Postgres 18 descartável (docker ou IA_TESTE_PG_DSN)",
]

[tool.ruff]
line-length = 140
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # acentos e símbolos em português são intencionais

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S311", "S603", "S607", "S608", "E501", "RUF012"]
"scripts/**" = ["S603", "S607", "E501"]
